schemaVersion: 3

mechanism:
  id: homologous-recombination
  name: Homologous recombination — end resection and RAD51 loading
  description: >
    The first phase of double-strand break repair by homologous recombination: the break is
    sensed, its 5′ ends are resected in two stages, and RAD51 assembles on the resulting 3′
    single-stranded overhang. The mechanism stops there on purpose. Strand invasion, D-loop
    formation, synthesis on the sister chromatid and resolution pair two nucleic-acid molecules,
    which the model does not represent yet (RFC 0004).

compartments: [nucleus]

actors:
  - id: dna
    type: dna
    label: Broken chromosome
    compartment: nucleus
    nucleic: { length: 80 }
    sites:
      - id: break
        type: double-strand-break
        at: 40
  - id: mrn
    type: complex
    label: MRN
    color: "#fb923c"
    compartment: nucleus
  - id: brca1
    type: protein
    label: BRCA1
    color: "#f472b6"
    compartment: nucleus
  - id: exo1
    type: protein
    label: EXO1
    color: "#5aa9a0"
    compartment: nucleus
  - id: rad51
    type: protein
    label: RAD51
    color: "#818cf8"
    compartment: nucleus

steps:
  - id: break
    title: Double-strand break
    summary: Both strands are cut at the same position
    actions:
      - type: cleave
        target: dna.break
        lesion: double-strand-break

  - id: sensing
    title: End sensing
    summary: MRN binds the broken ends
    actions:
      - type: bind
        actor: mrn
        target: dna.break

  - id: short-range
    title: Short-range resection
    summary: MRN, with BRCA1, trims the 5′ ends
    keyEvents:
      - BRCA1 joins MRN at the break and favours resection
      - The 5′ end of each fragment is shortened, exposing short 3′ overhangs
    actions:
      - type: recruit
        actor: brca1
        target: mrn
      - type: resect
        target: dna.break
        length: 6
        by: mrn

  - id: long-range
    title: Long-range resection
    summary: EXO1 extends the 3′ overhangs
    keyEvents:
      - EXO1 continues 5′→3′ from where MRN stopped
      - Each fragment now ends in a long 3′ single-stranded tail
    actions:
      - type: recruit
        actor: exo1
        target: dna.break
      - type: resect
        target: dna.break
        length: 12
        by: exo1

  - id: filament
    title: RAD51 filament formation
    summary: RAD51 assembles on the 3′ overhang
    keyEvents:
      - EXO1 leaves the resected end
      - RAD51 polymerises along the 3′ single-stranded DNA, ready to search for the homologous sequence
    actions:
      - type: unbind
        actor: exo1
      - type: hide
        actor: exo1
      - type: recruit
        actor: rad51
        target: dna.break
      - type: polymerize
        actor: rad51
        product: RAD51
        length: 11
